name: Validate and build Orbit
on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: orbit-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - run: node scripts/admin-smoke.mjs
  windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Parse the Windows helper
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path app/native/windows.ps1), [ref]$tokens, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { $parseErrors | Format-List; exit 1 }
          '{"id":1,"op":"list"}' | powershell.exe -NoProfile -NonInteractive -File app/native/windows.ps1 | Out-File native-result.json
          $r = Get-Content native-result.json -Raw | ConvertFrom-Json
          if ($r.error -or $r.id -ne 1) { throw 'Windows helper smoke check failed.' }
      - run: npm run test:desktop
        timeout-minutes: 3
      - run: node scripts/local-play-smoke.mjs
        timeout-minutes: 3
      - name: Configure the public license service
        env:
          ORBIT_LICENSE_PROVIDER: ${{ vars.ORBIT_LICENSE_PROVIDER }}
          ORBIT_KEYAUTH_NAME: ${{ vars.ORBIT_KEYAUTH_NAME }}
          ORBIT_KEYAUTH_OWNER_ID: ${{ vars.ORBIT_KEYAUTH_OWNER_ID }}
          ORBIT_KEYAUTH_VERSION: ${{ vars.ORBIT_KEYAUTH_VERSION }}
          ORBIT_KEYAUTH_SUBSCRIPTIONS: ${{ vars.ORBIT_KEYAUTH_SUBSCRIPTIONS }}
          ORBIT_LICENSE_SERVICE_URL: ${{ vars.ORBIT_LICENSE_SERVICE_URL }}
          ORBIT_LICENSE_PUBLIC_KEY: ${{ vars.ORBIT_LICENSE_PUBLIC_KEY }}
        run: node scripts/configure-services.mjs
      - run: npm run dist -- --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: node scripts/verify-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest*.yml
            release/beta*.yml
          if-no-files-found: error

  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Orbit-Windows
          path: release
      - name: Publish the tested Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_TAG" == "main" ]]; then
            RELEASE_TAG="v$(node -p 'require("./package.json").version')"
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              echo "This version is already published; bump package.json for a new release."
              exit 0
            fi
          fi
          export RELEASE_TAG
          node -e 'const p = require("./package.json"); if (process.env.RELEASE_TAG !== "v" + p.version) process.exit(1);'
          if [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "Orbit ${RELEASE_TAG#v}" --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" release/* --target "$GITHUB_SHA" --title "Orbit ${RELEASE_TAG#v}" --generate-notes
          fi
