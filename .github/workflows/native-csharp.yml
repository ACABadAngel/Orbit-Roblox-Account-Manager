name: Native C# preview
on:
  push:
    branches: [main, 'codex/**']
    paths: ['native/**', '.github/workflows/native-csharp.yml']
  pull_request:
    paths: ['native/**', '.github/workflows/native-csharp.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project native/Orbit.Tests/Orbit.Tests.csproj -c Release
  windows:
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build native/Orbit.slnx -c Release -m:1
      - run: dotnet run --project native/Orbit.Tests/Orbit.Tests.csproj -c Release --no-build
      - name: Exercise DPAPI and render native views
        shell: pwsh
        run: |
          $process = Start-Process dotnet -ArgumentList @('native/Orbit.Desktop/bin/Release/net10.0-windows/Orbit.Native.dll', '--smoke-test', "$PWD/native/artifacts/smoke") -Wait -PassThru
          Get-Content native/artifacts/smoke/windows-smoke.txt
          if ($process.ExitCode -ne 0) { throw "Native smoke test failed: $($process.ExitCode)" }
        timeout-minutes: 3
      - name: Publish standalone native preview
        run: dotnet publish native/Orbit.Desktop/Orbit.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o native/artifacts/portable
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Orbit-Native-Preview-Windows
          path: |
            native/artifacts/portable/
            native/artifacts/smoke/
          if-no-files-found: error
# Development artifact only. Never create a release or replace the stable Electron updater feed.
