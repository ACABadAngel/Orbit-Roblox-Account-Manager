name: Stop obsolete native test runs
on:
  push:
    branches: [maintenance/stop-obsolete-tests]
permissions:
  actions: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel the two superseded test runs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ACABadAngel/Orbit-Roblox-Account-Manager
        run: |
          gh run cancel 39309479548
          gh run cancel 39309464183
